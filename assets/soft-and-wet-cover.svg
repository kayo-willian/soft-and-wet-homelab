<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">SOFT &amp; WET — The homelab experiment</title>
<desc id="desc">Original cyan-and-magenta halftone manga-inspired artwork with a tiny Debian laptop, Docker containers, huge italic comic title, pop-art speed lines and floating bubbles. No remote-access app branding.</desc>
<defs>
