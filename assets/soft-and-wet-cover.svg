  <linearGradient id="soap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8dc"/><stop offset=".22" stop-color="#ff8cb9"/><stop offset=".5" stop-color="#6b86eb"/><stop offset=".79" stop-color="#08d8d3"/><stop offset="1" stop-color="#f9e0c8"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdef"/><stop offset=".5" stop-color="#ffe893"/><stop offset="1" stop-color="#f8b82f"/></linearGradient>
  <linearGradient id="magenta" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff3b99"/><stop offset="1" stop-color="#db0061"/></linearGradient>
</defs>
