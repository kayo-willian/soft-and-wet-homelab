services:
  navidrome:
    image: navidrome/navidrome:latest
    container_name: navidrome
    user: "${HOST_UID}:${HOST_GID}"
    ports:
      - "4533:4533"
    restart: unless-stopped
    volumes:
      - ./data/navidrome:/data
      - ./music:/music:ro
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
